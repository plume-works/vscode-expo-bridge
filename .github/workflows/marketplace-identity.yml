name: Marketplace identity

# Prints the managed identity's Marketplace profile; its `id` is what the publisher's
# Members page accepts. Run it from a `v*` tag that is not a version, such as `v0-identity`.
on: workflow_dispatch

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Print the Azure DevOps identity
        run: >-
          az rest -u https://app.vssps.visualstudio.com/_apis/connectionData
          --resource 499b84ac-1321-427f-aa17-267ca6975798
          --query authenticatedUser
      - name: Print the Marketplace profile
        run: >-
          az rest -u https://app.vssps.visualstudio.com/_apis/profile/profiles/me
          --resource 499b84ac-1321-427f-aa17-267ca6975798
